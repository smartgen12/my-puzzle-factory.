<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Factory Pro - Classic Sudoku</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h1 {
            font-size: 24px;
            margin-top: 0;
            text-align: center;
        }

        .sidebar nav {
            margin-top: 30px;
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav ul li {
            margin-bottom: 10px;
        }

        .sidebar nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            background-color: #34495e;
            text-align: center;
        }

        .sidebar nav ul li a.active {
            background-color: #3498db;
        }

        .sidebar nav ul li a:hover {
            background-color: #3d566e;
        }

        .main-content {
            flex: 1;
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sudoku-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            border: 2px solid black;
            width: 400px;
            height: 400px;
        }

        .sudoku-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }

        .sudoku-cell.hidden {
            color: transparent;
        }

        .sudoku-cell.solution {
            color: black;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Puzzle Factory Pro</h1>
        <nav>
            <ul>
                <li><a href="index.html">Back to Dashboard</a></li>
                <li><a href="#" class="active">Classic Sudoku</a></li>
                <li><a href="maze.html">Random Mazes</a></li>
                <li><a href="word_maze.html">Word-Search Maze</a></li>
            </ul>
        </nav>
    </div>
    <div class="main-content">
        <h1>Classic Sudoku</h1>
        <div class="sudoku-container">
            <div class="sudoku-grid" id="sudoku-grid"></div>
            <div class="controls">
                <button id="toggle-solution">Show Solution</button>
                <button id="download-pdf">Download PDF</button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('sudoku-grid');
            const toggleSolutionButton = document.getElementById('toggle-solution');
            const downloadPdfButton = document.getElementById('download-pdf');

            // Sample Sudoku puzzle (0 represents empty cells)
            const puzzle = [
                [5, 3, 0, 0, 7, 0, 0, 0, 0],
                [6, 0, 0, 1, 9, 5, 0, 0, 0],
                [0, 9, 8, 0, 0, 0, 0, 6, 0],
                [8, 0, 0, 0, 6, 0, 0, 0, 3],
                [4, 0, 0, 8, 0, 3, 0, 0, 1],
                [7, 0, 0, 0, 2, 0, 0, 0, 6],
                [0, 6, 0, 0, 0, 0, 2, 8, 0],
                [0, 0, 0, 4, 1, 9, 0, 0, 5],
                [0, 0, 0, 0, 8, 0, 0, 7, 9]
            ];

            // Sample Sudoku solution
            const solution = [
                [5, 3, 4, 6, 7, 8, 9, 1, 2],
                [6, 7, 2, 1, 9, 5, 3, 4, 8],
                [1, 9, 8, 3, 4, 2, 5, 6, 7],
                [8, 5, 9, 7, 6, 1, 4, 2, 3],
                [4, 2, 6, 8, 5, 3, 7, 9, 1],
                [7, 1, 3, 9, 2, 4, 8, 5, 6],
                [9, 6, 1, 5, 3, 7, 2, 8, 4],
                [2, 8, 7, 4, 1, 9, 6, 3, 5],
                [3, 4, 5, 2, 8, 6, 1, 7, 9]
            ];

            // Create the Sudoku grid
            function createGrid(puzzleArray, showSolution = false) {
                grid.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'sudoku-cell';
                        if (puzzleArray[i][j] === 0 || (puzzleArray[i][j] !== 0 && !showSolution)) {
                            cell.classList.add('hidden');
                        }
                        cell.textContent = puzzleArray[i][j] === 0 ? '' : puzzleArray[i][j];
                        grid.appendChild(cell);
                    }
                }
            }

            // Toggle solution visibility
            function toggleSolution() {
                const cells = document.querySelectorAll('.sudoku-cell');
                cells.forEach((cell, index) => {
                    const i = Math.floor(index / 9);
                    const j = index % 9;
                    if (solution[i][j] !== puzzle[i][j]) {
                        cell.classList.toggle('solution');
                        cell.textContent = cell.classList.contains('solution') ? solution[i][j] : '';
                    }
                });
                toggleSolutionButton.textContent = toggleSolutionButton.textContent === 'Show Solution' ? 'Hide Solution' : 'Show Solution';
            }

            // Download PDF
            function downloadPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: [215.9, 279.4] // 8.5x11 inches in mm
                });

                // Page 1: Puzzle
                doc.setFontSize(24);
                doc.text('Classic Sudoku - Puzzle', 105.95, 20, { align: 'center' });
                doc.setFontSize(12);
                doc.text('Generated by Puzzle Factory Pro', 105.95, 30, { align: 'center' });

                // Draw puzzle grid
                const cellSize = 18;
                const startX = 30;
                const startY = 50;

                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        const x = startX + j * cellSize;
                        const y = startY + i * cellSize;
                        doc.rect(x, y, cellSize, cellSize);
                        if (puzzle[i][j] !== 0) {
                            doc.text(puzzle[i][j].toString(), x + cellSize / 2, y + cellSize / 2, { align: 'center' });
                        }
                    }
                }

                // Add thicker borders for 3x3 subgrids
                for (let i = 0; i <= 3; i++) {
                    const x = startX + i * cellSize * 3;
                    doc.setLineWidth(1.5);
                    doc.line(x, startY, x, startY + cellSize * 9);
                    doc.line(startX, startY + i * cellSize * 3, startX + cellSize * 9, startY + i * cellSize * 3);
                }

                // Page 2: Solution
                doc.addPage();

                doc.setFontSize(24);
                doc.text('Classic Sudoku - Solution', 105.95, 20, { align: 'center' });
                doc.setFontSize(12);
                doc.text('Generated by Puzzle Factory Pro', 105.95, 30, { align: 'center' });

                // Draw solution grid
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        const x = startX + j * cellSize;
                        const y = startY + i * cellSize;
                        doc.rect(x, y, cellSize, cellSize);
                        doc.text(solution[i][j].toString(), x + cellSize / 2, y + cellSize / 2, { align: 'center' });
                    }
                }

                // Add thicker borders for 3x3 subgrids
                for (let i = 0; i <= 3; i++) {
                    const x = startX + i * cellSize * 3;
                    doc.setLineWidth(1.5);
                    doc.line(x, startY, x, startY + cellSize * 9);
                    doc.line(startX, startY + i * cellSize * 3, startX + cellSize * 9, startY + i * cellSize * 3);
                }

                // Save the PDF
                doc.save('sudoku_puzzle.pdf');
            }

            // Initialize the grid
            createGrid(puzzle);

            // Event listeners
            toggleSolutionButton.addEventListener('click', toggleSolution);
            downloadPdfButton.addEventListener('click', downloadPDF);
        });
    </script>
</body>
</html>
