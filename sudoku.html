<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sudoku - Puzzle Factory Pro</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            background-color: #f4f4f9 !important;
            color: #000000 !important;
        }
        .sidebar {
            width: 220px;
            background-color: #2c3e50 !important;
            color: white !important;
            height: 100vh;
            padding: 20px 10px;
            position: fixed;
            left: 0;
            top: 0;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #1abc9c !important;
        }
        .tab {
            padding: 12px;
            background-color: #34495e !important;
            color: white !important;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            display: block;
            text-decoration: none;
            transition: 0.3s;
        }
        .tab.active, .tab:hover { background-color: #1abc9c !important; }
        .tab.back-btn { background-color: #e74c3c !important; }
        .tab.back-btn:hover { background-color: #c0392b !important; }
        
        .main-content {
            margin-left: 220px;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .controls-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-weight: bold;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }
        .grid-container {
            background: #ffffff !important;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            border: 2px solid #333333;
            position: relative;
            display: block;
        }
        .watermark {
            position: absolute;
            font-size: 55px;
            font-weight: bold;
            color: rgba(0, 255, 255, 0.18);
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            top: 40%;
            left: 15%;
            transform: rotate(-15deg);
        }
        .sudoku-grid {
            display: grid;
            border: 3px solid #000000;
            z-index: 2;
            position: relative;
            background: #ffffff !important;
        }
        .sudoku-cell {
            text-align: center;
            font-weight: bold;
            border: 1px solid #bbbbbb;
            background: transparent;
            color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ضبط المقاسات بدقة تمنع ظهور نقطة */
        .grid-4 { 
            grid-template-columns: repeat(4, 65px); 
            grid-template-rows: repeat(4, 65px); 
            width: 260px; height: 260px;
        }
        .grid-4 .sudoku-cell { width: 65px; height: 65px; font-size: 26px; }
        .grid-4 .sudoku-cell:nth-child(2n) { border-right: 3px solid #000; }
        .grid-4 div:nth-child(n+5):nth-child(-n+8) { border-bottom: 3px solid #000; }

        .grid-6 { 
            grid-template-columns: repeat(6, 55px); 
            grid-template-rows: repeat(6, 55px); 
            width: 330px; height: 330px;
        }
        .grid-6 .sudoku-cell { width: 55px; height: 55px; font-size: 22px; }
        .grid-6 .sudoku-cell:nth-child(3n) { border-right: 3px solid #000; }
        .grid-6 div:nth-child(n+13):nth-child(-n+18) { border-bottom: 3px solid #000; }

        .grid-9 { 
            grid-template-columns: repeat(9, 45px); 
            grid-template-rows: repeat(9, 45px); 
            width: 405px; height: 405px;
        }
        .grid-9 .sudoku-cell { width: 45px; height: 45px; font-size: 20px; }
        .grid-9 .sudoku-cell:nth-child(3n) { border-right: 3px solid #000; }
        .grid-9 div:nth-child(n+19):nth-child(-n+27), .grid-9 div:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #000; }

        .solution-number { color: #7f8c8d !important; display: none; }
        .btn-container { display: flex; gap: 15px; margin-top: 15px; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #2980b9 !important;
            color: white !important;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #3498db !important; }
        button.generate-btn { background-color: #27ae60 !important; }
        button.generate-btn:hover { background-color: #2ecc71 !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Puzzle Factory Pro</h2>
        <a href="index.html" class="tab back-btn">⬅ Back to Dashboard</a>
        <div class="tab active">Classic Sudoku</div>
    </div>

    <div class="main-content">
        <div class="controls-container">
            <div class="control-group">
                <label>Target Age:</label>
                <select id="target-age" onchange="updateDifficultyOptions()">
                    <option value="Kids">Kids</option>
                    <option value="Adults">Adults</option>
                </select>
            </div>
            <div class="control-group">
                <label>Difficulty Level:</label>
                <select id="difficulty-level" onchange="generatePuzzle()">
                    <!-- dynamic -->
                </select>
            </div>
        </div>

        <div class="grid-container" id="capture-area">
            <div class="watermark">SMART GEN</div>
            <div id="sudoku-grid" class="sudoku-grid"></div>
        </div>

        <div class="btn-container">
            <button class="generate-btn" onclick="generatePuzzle()">Generate New Puzzle</button>
            <button onclick="toggleSolution()">Show / Hide Solution</button>
            <button onclick="downloadPDF()">Download PDF</button>
            <button onclick="downloadImage()">Download Image</button>
        </div>
    </div>

    <script>
        let currentSize = 4;
        let currentSolution = [];
        let currentPuzzle = [];
        let showingSolution = false;

        // مصفوفات حقيقية ممتلئة بالكامل لمنع الاختفاء والتهنيج
        const samples = {
            4: {
                sol: [[2,1,4,3],[4,3,2,1],[1,2,3,4],[3,4,1,2]],
                puz: [[2,0,4,3],[0,3,2,1],[1,2,0,4],[3,4,1,0]]
            },
            6: {
                sol: [[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,4,5,6,1],[5,6,1,2,3,4],[3,4,5,6,1,2],[6,1,2,3,4,5]],
                puz: [[1,0,3,4,0,6],[4,5,0,1,2,3],[0,3,4,0,6,1],[5,6,1,2,3,4],[3,4,5,6,1,2],[6,1,0,3,4,0]]
            },
            9: {
                sol: [,
 ,
 ,
 ,
 ,
 ,
 ,
 ,
                    [3,4,5,2,8,6,1,7,9]
                ],
                puz: [,
 ,
 ,
 ,
 ,
 ,
 ,
 ,
                    [0,0,0,0,8,0,0,7,9]
                ]
            }
        };

        function updateDifficultyOptions() {
            const age = document.getElementById('target-age').value;
            const diffSelect = document.getElementById('difficulty-level');
            diffSelect.innerHTML = '';

            if (age === 'Kids') {
                diffSelect.innerHTML = '<option value="Easy">Easy (4x4 Grid)</option><option value="Hard">Hard (6x6 Grid)</option>';
            } else {
                diffSelect.innerHTML = '<option value="Easy">Easy (9x9 Grid)</option><option value="Medium">Medium (9x9 Grid)</option><option value="Hard">Hard (9x9 Grid)</option>';
            }
            generatePuzzle();
        }

        function generatePuzzle() {
            showingSolution = false;
            const age = document.getElementById('target-age').value;
            const diff = document.getElementById('difficulty-level').value;
            const gridEl = document.getElementById('sudoku-grid');

            if (age === 'Kids' && diff === 'Easy') currentSize = 4;
            else if (age === 'Kids' && diff === 'Hard') currentSize = 6;
            else currentSize = 9;

            gridEl.className = 'sudoku-grid ' + (currentSize === 4 ? 'grid-4' : currentSize === 6 ? 'grid-6' : 'grid-9');

            currentSolution = samples[currentSize].sol;
            currentPuzzle = samples[currentSize].puz;

            gridEl.innerHTML = '';
            for (let r = 0; r < currentSize; r++) {
