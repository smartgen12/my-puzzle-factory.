<body>

    <div class="sidebar">
        <h2>Puzzle Factory Pro</h2>
        <a href="index.html" class="tab back-btn">⬅ Back to Dashboard</a>
        <div class="tab active">Classic Sudoku</div>
    </div>

    <div class="main-content">
        <div class="settings-container">
            <div class="setting-group">
                <label for="target-age">Target Age:</label>
                <select id="target-age">
                    <option value="kids">Kids</option>
                    <option value="adults">Adults</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="difficulty">Difficulty Level:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>
        <div class="grid-container">
            <div class="watermark">SMART GEN</div>
            <div id="sudoku-grid" class="sudoku-grid"></div>
        </div>
        <div class="btn-container">
            <button class="generate-btn" onclick="generateNewPuzzle()">Generate New Puzzle</button>
            <button onclick="toggleSolution()">Show / Hide Solution</button>
            <button onclick="downloadSudokuPDF()">Download PDF</button>
            <button onclick="downloadImage()">Download Image</button>
        </div>
    </div>

    <script>
        let solution = [];
        let puzzle = [];
        let gridSize = 9;
        const gridEl = document.getElementById('sudoku-grid');
        let showingSolution = false;

        // Generate a complete valid Sudoku solution
        function generateSolution(size) {
            const base = Array.from({length: size}, (_, i) => i + 1);
            solution = Array.from({length: size}, () => base.slice());

            // Shuffle rows within each block
            for (let i = 0; i < size; i += Math.sqrt(size)) {
                const block = solution.slice(i, i + Math.sqrt(size));
                shuffleArray(block);
                solution.splice(i, Math.sqrt(size), ...block);
            }

            // Shuffle columns within each block
            for (let i = 0; i < size; i++) {
                const column = solution.map(row => row[i]);
                shuffleArray(column);
                for (let j = 0; j < size; j++) {
                    solution[j][i] = column[j];
                }
            }

            // Shuffle entire blocks
            const blocks = [];
            for (let i = 0; i < size; i += Math.sqrt(size)) {
                blocks.push(solution.slice(i, i + Math.sqrt(size)));
            }
            shuffleArray(blocks);
            solution = blocks.flat();

            return solution;
        }

        // Generate a puzzle by removing numbers from the solution
        function generatePuzzle() {
            const targetAge = document.getElementById('target-age').value;
            const difficulty = document.getElementById('difficulty').value;

            // Determine grid size based on settings
            if (targetAge === 'kids') {
                if (difficulty === 'easy') {
                    gridSize = 4;
                } else {
                    gridSize = 6;
                }
            } else {
                gridSize = 9;
            }

            const solution = generateSolution(gridSize);
            puzzle = solution.map(row => row.slice());

            let cellsToRemove;

            if (targetAge === 'kids') {
                switch (difficulty) {
                    case 'easy':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.5); // 50% visible
                        break;
                    case 'medium':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.6); // 40% visible
                        break;
                    case 'hard':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.7); // 30% visible
                        break;
                }
            } else {
                switch (difficulty) {
                    case 'easy':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.6); // 40% visible
                        break;
                    case 'medium':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.7); // 30% visible
                        break;
                    case 'hard':
                        cellsToRemove = Math.floor(gridSize * gridSize * 0.8); // 20% visible
                        break;
                }
            }

            // Remove numbers while ensuring the puzzle remains solvable
            while (cellsToRemove > 0) {
                const row = Math.floor(Math.random() * gridSize);
                const col = Math.floor(Math.random() * gridSize);

                if (puzzle[row][col] !== 0) {
                    const temp = puzzle[row][col];
                    puzzle[row][col] = 0;

                    // Check if the puzzle still has a unique solution
                    if (hasUniqueSolution(puzzle)) {
                        cellsToRemove--;
                    } else {
                        puzzle[row][col] = temp;
                    }
                }
            }

            return puzzle;
        }

        // Check if the puzzle has a unique solution (simplified version)
        function hasUniqueSolution(puzzle) {
            // In a real implementation, you would use a more sophisticated algorithm
            // This simplified version just checks if the puzzle is not completely empty
            return puzzle.some(row => row.some(cell => cell !== 0));
        }

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createGrid() {
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${gridSize}, ${gridSize === 4 ? '60px' : gridSize === 6 ? '50px' : '45px'})`;
            gridEl.style.gridTemplateRows = `repeat(${gridSize}, ${gridSize === 4 ? '60px' : gridSize === 6 ? '50px' : '45px'})`;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = `sudoku-cell size-${gridSize}`;

                    // Add thicker borders for blocks
                    if (r % Math.sqrt(gridSize) === 0) {
                        cell.style.borderTopWidth = '3px';
                    }
                    if (r === gridSize - 1) {
                        cell.style.borderBottomWidth = '3px';
                    }
                    if (c % Math.sqrt(gridSize) === 0) {
                        cell.style.borderLeftWidth = '3px';
                    }
                    if (c === gridSize - 1) {
                        cell.style.borderRightWidth = '3px';
                    }

                    if (puzzle[r][c] !== 0) {
                        cell.innerText = puzzle[r][c];
                    } else {
                        const span = document.createElement('span');
                        span.className = 'solution-number';
                        span.innerText = solution[r][c];
                        cell.appendChild(span);
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function toggleSolution() {
            showingSolution = !showingSolution;
            const numbers = document.querySelectorAll('.solution-number');
            numbers.forEach(num => {
                num.style.display = showingSolution ? 'inline' : 'none';
            });
        }

        function generateNewPuzzle() {
            generatePuzzle();
            createGrid();
            showingSolution = false;
            toggleSolution();
        }

        function downloadSudokuPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'p', unit: 'in', format: 'letter' });

            // Page 1: Clean Puzzle interior for KDP printing
            doc.setFontSize(24);
            doc.text("Sudoku Puzzle", 4.25, 1.5, { align: "center" });

            const cellSize = 3.5 / gridSize;
            let startX = (8.5 - cellSize * gridSize) / 2;
            let startY = 2.5;

            for (let i = 0; i <= gridSize; i++) {
                const lineWidth = (i % Math.sqrt(gridSize) === 0) ? 0.03 : 0.01;
                doc.setLineWidth(lineWidth);
                doc.line(startX, startY + i * cellSize, startX + gridSize * cellSize, startY + i * cellSize);
                doc.line(startX + i * cellSize, startY, startX + i * cellSize, startY + gridSize * cellSize);
            }

            doc.setFontSize(16);
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (puzzle[r][c] !== 0) {
                        doc.text(puzzle[r][c].toString(), startX + c * cellSize + cellSize / 2, startY + r * cellSize + cellSize / 2, { align: 'center' });
                    }
                }
            }

            // Page 2: Solution interior for KDP printing
            doc.addPage();
            doc.setFontSize(24);
            doc.text("Sudoku Solution", 4.25, 1.5, { align: "center" });

            for (let i = 0; i <= gridSize; i++) {
                const lineWidth = (i % Math.sqrt(gridSize) === 0) ? 0.03 : 0.01;
                doc.setLineWidth(lineWidth);
                doc.line(startX, startY + i * cellSize, startX + gridSize * cellSize, startY + i * cellSize);
                doc.line(startX + i * cellSize, startY, startX + i * cellSize, startY + gridSize * cellSize);
            }

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    doc.text(solution[r][c].toString(), startX + c * cellSize + cellSize / 2, startY + r * cellSize + cellSize / 2, { align: 'center' });
                }
            }

            doc.save("sudoku-puzzle.pdf");
        }
