<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Sudoku - Puzzle Factory</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            background-color: #f4f4f9 !important;
            color: #000000 !important;
        }
        .sidebar {
            width: 220px;
            background-color: #2c3e50 !important;
            color: white !important;
            height: 100vh;
            padding: 20px 10px;
            position: fixed;
            left: 0;
            top: 0;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #1abc9c !important;
        }
        .tab {
            padding: 12px;
            background-color: #34495e !important;
            color: white !important;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            display: block;
            text-decoration: none;
            transition: 0.3s;
        }
        .tab.active, .tab:hover {
            background-color: #1abc9c !important;
        }
        .tab.back-btn {
            background-color: #e74c3c !important;
        }
        .tab.back-btn:hover {
            background-color: #e74c3c !important;
        }
        .main-content {
            margin-left: 220px;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9 !important;
            min-height: 100vh;
        }
        .section {
            width: 100%;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        .grid-container {
            background: #ffffff !important;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            border: 2px solid #333333;
            position: relative;
            display: flex;
            justify-content: center;
        }
        .sudoku-grid {
            display: grid;
            border: 3px solid #000000;
            position: relative;
            z-index: 1;
        }
        .sudoku-cell {
            width: 60px;
            height: 60px;
            text-align: center;
            line-height: 60px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #000000;
            background: #ffffff !important;
            color: #000000 !important;
        }
        .grid-4 {
            grid-template-columns: repeat(4, 60px);
            grid-template-rows: repeat(4, 60px);
        }
        .grid-9 {
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
        }
        .grid-9 .sudoku-cell {
            width: 45px;
            height: 45px;
            line-height: 45px;
            font-size: 20px;
        }
        .grid-9 .sudoku-cell:nth-child(3n) {
            border-right: 3px solid #000000;
        }
        .grid-9 div:nth-child(n+19):nth-child(-n+27),
        .grid-9 div:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 3px solid #000000;
        }
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 48px;
            font-weight: bold;
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
