<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Factory Pro - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            color: #ecf0f1;
            letter-spacing: 1px;
        }

        .nav-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 15px;
        }

        .nav-button {
            display: block;
            padding: 14px 20px;
            text-decoration: none;
            color: #ecf0f1;
            background-color: #34495e;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .nav-button:hover {
            background-color: #2c3e50;
            color: #f1c40f;
        }

        .main-content {
            margin-left: 220px;
            flex: 1;
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .content-container {
            max-width: 800px;
            text-align: center;
        }

        .welcome-title {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .welcome-subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .nav-menu {
                flex-direction: row;
                justify-content: center;
                padding: 10px;
            }
            .nav-button {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1 class="sidebar-title">Puzzle Factory Pro</h1>
        <nav class="nav-menu">
            <a href="sudoku.html" class="nav-button">Classic Sudoku</a>
            <a href="maze.html" class="nav-button">Random Mazes</a>
            <a href="word_maze.html" class="nav-button">Word-Search Maze</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="content-container">
            <h1 class="welcome-title">Welcome to Your Puzzle Factory!</h1>
            <p class="welcome-subtitle">Choose a puzzle type from the sidebar menu to start generating interiors for Amazon KDP.</p>
        </div>
    </main>
</body>
</html>
